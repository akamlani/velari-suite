[project]
name            = "velari-ai"
authors         = [{name = "Ari Kamlani", email = "akamlani@gmail.com"}]
description     = "Velari AI utilities"
version         = "0.1.0"
requires-python = ">=3.12"
readme          = "README.md"
license         = {text = "Apache-2.0"}
keywords        = ["ai", "experiments", "incubation", "innovation"]
dependencies    = [
    "velari-core",
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic>=2.9",
    "omegaconf>=2.3",
    "scipy>=1.13",
    "openai>=2.0",
]

[project.optional-dependencies]
agents = [
    "agno>=2.8.7",
    "beautifulsoup4>=4.12",
    "fastmcp[apps]>=3.0",
    "grandalf>=0.8",
    "griffe>=2.0",
    "jinja2>=3.1",
    "langchain>=1.0",
    "langchain-chroma>=0.2",
    "langchain-core>=1.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.0",
    "langchain-text-splitters>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "tavily-python>=0.7.27",
]
data = [
    "datasets>=3.0",
]

[tool.uv.sources]
velari-core = { workspace = true }

[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where         = ["."]
include       = ["velari_ai*"]
