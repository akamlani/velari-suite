[project]
name            = "velari-data"
authors         = [{name = "Ari Kamlani", email = "akamlani@gmail.com"}]
description     = "Velari data utilities"
version         = "0.1.0"
requires-python = ">=3.12"
readme          = "README.md"
license         = {text = "Apache-2.0"}
keywords        = ["ai", "data", "experiments", "incubation", "innovation"]
dependencies    = [
    "velari-core",
]

[tool.uv.sources]
velari-core = { workspace = true }

[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where         = ["."]
include       = ["velari_data*"]
