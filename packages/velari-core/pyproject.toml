[project]
name            = "velari-core"
authors         = [{name = "Ari Kamlani", email = "akamlani@gmail.com"}]
description     = "Velari core utilities: I/O, filesystem, partitioning, experiment management, and integrations"
version         = "0.1.0"
requires-python = ">=3.12"
readme          = "README.md"
license         = {text = "Apache-2.0"}
keywords        = ["ai", "experiments", "incubation", "innovation"]
dependencies    = [
    "watermark>=2.4",
    "appdirs>=1.4",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "rich>=13.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic-core>=2.20",
    "pydantic>=2.9",
    "httpx[http2]>=0.27",
    "python-dotenv>=1.2.2",
    "pypdf>=5.0",
    "jinja2>=3.1",
]

[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where         = ["."]
include       = ["velari*"]
