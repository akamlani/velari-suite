[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pip>=24.0",
    "ipykernel>=6.0",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "nbformat>=4.2",
    "pytest>=8.0",
    "ruff>=0.9",
    "pyright>=1.1",
    "typer>=0.12",
]

[tool.ruff]
line-length     = 122
exclude         = [".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# "E999": unexpected token Newline
# "E731": do not assign a lambda expression, use a def
# "F401": module imported but unused
# "F821": undefined name name
# "F722": syntax error in forward annotation
# "I001": import statements are in the wrong order
ignore = ["F841", "F401", "E731", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["packages/velari-core", "packages/velari-data", "packages/velari-ai"]
typeCheckingMode = "standard"

[tool.ruff.lint.pydocstyle]
convention = "google"
