[project]
name            = "velari-studios-suite"
authors         = [{name = "Ari Kamlani", email = "akamlani@gmail.com"}]
description     = "Suite of Velari Studios tools and utilities"
version         = "0.1.0"
requires-python = ">=3.12"
readme          = "README.md"
license         = {text = "Apache-2.0"}
keywords        = ["ai", "experiments", "incubation", "innovation"]
dependencies    = [
    "appdirs>=1.4",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "rich>=13.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "httpx[http2]>=0.27",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pip>=24.0",
    "ipykernel>=6.0",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "nbformat>=4.2",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where         = ["."]
include       = ["velari*", "examples*"]

[tool.ruff]
line-length     = 122
exclude         = [".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# "E999": unexpected token Newline
# "E731": do not assign a lambda expression, use a def
# "F401": module imported but unused
# "F821": undefined name name
# "F722": syntax error in forward annotation
# "I001": import statements are in the wrong order
ignore = ["F841", "F401", "E731", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"
