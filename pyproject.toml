[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/frontend"]

[dependency-groups]
dev = [
    "pip>=24.0",
    "ipykernel>=6.0",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "nbformat>=4.2",
    "pytest>=8.0",
    "ruff>=0.9",
    "pyright>=1.1",
    "typer>=0.12",
]

[tool.ruff]
line-length     = 168
exclude         = [".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# "E999": unexpected token Newline
# "E731": do not assign a lambda expression, use a def
# "F401": module imported but unused
# "F821": undefined name name
# "F722": syntax error in forward annotation
# "I001": import statements are in the wrong order
ignore = ["F841", "F401", "E731", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = ["--import-mode=importlib"]

[tool.pyright]
extraPaths = ["packages/velari-core", "packages/velari-data", "packages/velari-ai"]
typeCheckingMode = "standard"
# Explicit include, not just exclude: packages/frontend is a pnpm/Node package (not Python) whose
# node_modules/.pnpm tree is large and, in this Dropbox-synced repo, slow to enumerate — without an
# include list, pyright's default project root is the whole repo and it still has to walk that tree
# before exclude globs can prune it, which is what caused pyright to hang for minutes on a plain
# `uv run pyright` (individual `uv run pyright <package>` runs were always fast).
include = ["packages/velari-core", "packages/velari-data", "packages/velari-ai", "examples", "tests"]
# mlflow is intentionally not in the shared venv (pins pandas<3, conflicts with the workspace's
# pandas>=3) — run via `uv run --isolated --with mlflow --with pyright pyright <path>` instead.
exclude = [
    "packages/velari-ai/velari_ai/integrations/mlflow",
    "examples/ai/integrations/mlflow",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
