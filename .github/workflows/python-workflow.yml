name: Python Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python_ci:
    runs-on: ubuntu-latest
    steps:
      # checkout from target branch
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        # install specific version of uv and enable caching for faster installs in future runs
        with:
          version:      "0.11.3"
          enable-cache: true

      # set up python runtime — uv itself is already installed by astral-sh/setup-uv above;
      # skip `make install_python`'s download_python/uv_download step to avoid reinstalling uv
      # and conflicting with the pinned, cached copy setup-uv provides
      - name: Install Python and Dependencies
        run: make uv_install_python
